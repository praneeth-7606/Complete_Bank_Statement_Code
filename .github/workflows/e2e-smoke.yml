name: E2E smoke

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install frontend and E2E dependencies
        working-directory: frontend
        run: |
          npm ci
          npx --no-install agent-browser install --with-deps
      - name: Install report dependency
        run: python -m pip install pydantic
      - name: Start frontend
        working-directory: frontend
        run: |
          nohup npm run dev -- --host 127.0.0.1 > ../frontend.log 2>&1 &
          for i in {1..30}; do curl --fail --silent http://127.0.0.1:3001/login >/dev/null && exit 0; sleep 1; done
          cat ../frontend.log
          exit 1
      - name: Run provider-independent E2E smoke
        run: python backend/e2e_agent.py --base-url http://127.0.0.1:3001 --smoke-only
